<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Lumbini</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========== HEADER / MENU ========== -->
  <header>
    <div class="container nav">
      <a href="index.html" class="logo">Lumbini</a>
      <button class="menu-btn" id="menu-btn" aria-label="Open menu">&#9776;</button>
      <ul id="menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="information.html">Information</a></li>
        <li><a href="gallery.html" class="active">Gallery</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </div>
  </header>

  <section class="light page-banner center">
    <div class="container">
      <h1 class="section-title">Gallery</h1>
      <p class="section-sub">Pictures of Lumbini's sacred places.</p>
    </div>
  </section>

  <section>
    <div class="container">
      <!-- TO ADD A PICTURE: copy one <figure> block, paste it below, and change src and the caption -->
      <div class="gallery">
        <figure>
          <img src="images/mayadevi.svg" alt="Maya Devi Temple">
          <figcaption>Maya Devi Temple</figcaption>
        </figure>
        <figure>
          <img src="images/pillar.svg" alt="Ashoka Pillar">
          <figcaption>Ashoka Pillar</figcaption>
        </figure>
        <figure>
          <img src="images/pond.svg" alt="Puskarini Pond">
          <figcaption>Puskarini Pond</figcaption>
        </figure>
        <figure>
          <img src="images/peace-pagoda.svg" alt="World Peace Pagoda">
          <figcaption>World Peace Pagoda</figcaption>
        </figure>
        <figure>
          <img src="images/monastery.svg" alt="Monastic Zone">
          <figcaption>Monastic Zone</figcaption>
        </figure>
        <figure>
          <img src="images/museum.svg" alt="Lumbini Museum">
          <figcaption>Lumbini Museum</figcaption>
        </figure>
        <figure>
          <img src="images/flame.svg" alt="Eternal Peace Flame">
          <figcaption>Eternal Peace Flame</figcaption>
        </figure>
        <figure>
          <img src="images/festival.svg" alt="Buddha Jayanti">
          <figcaption>Buddha Jayanti</figcaption>
        </figure>
      </div>
    </div>
  </section>

  <!-- ========== FOOTER ========== -->
  <footer>
    <div class="container">
      <p>&copy; 2026 Lumbini Website | Horizon Gautam Buddha School | Grade 11/12 Computer Science Project</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
